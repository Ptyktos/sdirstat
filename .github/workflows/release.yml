# Public release pipeline. On a `v*` tag each OS runner builds the CLI binaries; the release job
# then checksums, SBOMs, signs (cosign keyless), and attests (SLSA build provenance) every
# artifact and cuts a GitHub Release.
#
# The native desktop app (formerly built and released here too) now lives in its own repo,
# Ptyktos/sdirstat-desktop. Its own release pipeline downloads this repo's released CLI binaries
# as its Tauri sidecar and cuts its own, separately versioned release.
#
# Supply chain: all third-party actions are pinned to a commit SHA (the tag in the trailing comment is
# informational). Signing/attestation use GitHub OIDC — no long-lived secrets.
#
# TESTED STATUS: linux and windows have both published successfully. macos is disabled (`if: false`
# on the job, dropped from `release`'s `needs`) — unexecuted on a real runner.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLI — glibc binary + .deb, and a static musl binary
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"; VER="${VER:-0.1.0}"
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --release --locked
          sh packaging/build-deb.sh "$VER"
          cargo build --release --locked --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/release/sdirstat                           "dist/sdirstat-${VER}-linux-x86_64"
          cp target/x86_64-unknown-linux-musl/release/sdirstat "dist/sdirstat-${VER}-linux-x86_64-musl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: linux, path: dist/* }

  # Native MSVC build, WebView2 preinstalled. linux+windows verified on v0.1.1; macos disabled below.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLI — sdirstat.exe (native MSVC)
        shell: bash
        # +crt-static: a plain MSVC build dynamically links vcruntime140.dll, which a stock Windows
        # install doesn't ship — "code execution cannot proceed" on a clean machine.
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"; VER="${VER:-0.1.0}"
          cargo build --release --locked
          mkdir -p dist
          cp target/release/sdirstat.exe "dist/sdirstat-${VER}-windows-x86_64.exe"
      - name: Install WiX + cargo-wix (own step so the WIX env propagates)
        shell: bash
        run: |
          set -eu
          if [ -z "${WIX:-}" ]; then choco install wixtoolset --no-progress -y || echo "WiX install issue"; fi
          cargo install cargo-wix --locked || echo "cargo-wix install issue"
      - name: CLI installer — cargo-wix .msi (best-effort, untested)
        shell: bash
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"; VER="${VER:-0.1.0}"
          cargo wix init --force || echo "wix init issue"
          mkdir -p _msi
          if cargo wix --no-build --nocapture --output _msi/ ; then
            mv _msi/*.msi "dist/sdirstat-${VER}-windows-x86_64.msi"
          else
            echo "::warning::cargo-wix CLI MSI failed (untested — adjust wix/main.wxs)"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: windows, path: dist/* }

  # DISABLED for now: unexecuted on a real runner. Flip `if: false` off once exercised, and add
  # `macos` back to the `release` job's `needs` below.
  macos:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLI — universal (Intel + Apple Silicon) binary
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"; VER="${VER:-0.1.0}"
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p dist
          lipo -create -output "dist/sdirstat-${VER}-macos-universal" \
            target/x86_64-apple-darwin/release/sdirstat \
            target/aarch64-apple-darwin/release/sdirstat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: macos, path: dist/* }

  release:
    needs: [linux, windows] # macos dropped from needs while its job is disabled (if: false above)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write       # create the Release + upload assets
      id-token: write       # cosign keyless (Fulcio/Rekor) + provenance, via OIDC — no stored keys
      attestations: write   # actions/attest-build-provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums (SHA256SUMS)
        run: ( cd dist && sha256sum * > SHA256SUMS )

      - name: SBOM (SPDX JSON, syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sdirstat.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign every artifact (cosign keyless)
        run: |
          set -eu
          cd dist
          for f in *; do
            case "$f" in *.cosign.bundle) continue;; esac
            cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"
          done

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Cut or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Idempotent: if the release already exists (e.g. pre-created in the UI, or a re-run),
          # upload/overwrite its assets instead of failing on `create`.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} exists — uploading assets (--clobber)"
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
